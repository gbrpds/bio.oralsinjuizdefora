<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oral Sin Implantes · Juiz de Fora</title>
  <meta name="description" content="Oral Sin Implantes Juiz de Fora — entre em contato, conheça nosso site, localização, blog e faça o quiz do seu sorriso." />

  <!-- Open Graph / compartilhamento -->
  <meta property="og:title" content="Oral Sin Implantes · Juiz de Fora" />
  <meta property="og:description" content="Cuidamos do seu sorriso. Fale com a gente, conheça nosso trabalho e tire suas dúvidas sobre implantes." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/hero.png" />

  <link rel="icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">

    <!-- ===================== HERO ===================== -->
    <!-- Banner completo (foto + logo + botões já embutidos na imagem).
         Sobre os dois botões verdes há áreas clicáveis transparentes,
         prontas para receber os links depois. -->
    <header class="hero">
      <img class="hero__img" src="assets/hero.png" alt="Oral Sin Implantes — Juiz de Fora" />
      <a class="hero__pill hero__pill--left"  href="#" aria-label="Botão esquerdo (definir link)"></a>
      <a class="hero__pill hero__pill--right" href="#" aria-label="Botão direito (definir link)"></a>
    </header>

    <!-- ===================== LINKS ===================== -->
    <main class="links">
      <a class="card" href="#" data-link="contato">
        <img src="assets/card-contato.png" alt="Entrar em Contato — estamos prontos para te atender e esclarecer suas dúvidas." />
      </a>

      <a class="card" href="#" data-link="site">
        <img src="assets/card-site.png" alt="Acesse nosso Site — venha conhecer quem cuida do seu sorriso!" />
      </a>

      <a class="card" href="#" data-link="localizacao">
        <img src="assets/card-localizacao.png" alt="Localização — veja como chegar até a gente." />
      </a>

      <a class="card" href="#" data-link="blog">
        <img src="assets/card-blog.png" alt="Blog Oral Sin JF — tudo sobre implantes e saúde bucal." />
      </a>

      <a class="card" href="#" data-link="quiz">
        <img src="assets/card-quiz.png" alt="Quiz — descubra o melhor caminho para o seu sorriso!" />
      </a>
    </main>

    <!-- ===================== RODAPÉ ===================== -->
    <footer class="footer">
      <img src="assets/footer.png" alt="© 2026 Oral Sin Juiz de Fora. Todos os direitos reservados. Segunda a sexta, das 08h às 18h." />
    </footer>

  </div>
</body>
</html>
